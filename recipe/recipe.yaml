schema_version: 1

context:
  name: just
  version: "1.58.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://github.com/casey/just/archive/${{ version }}.tar.gz
  sha256: c8a36e6e9397f2fdfcb0cc246fcdb790b52a784f3c8cabc0d8baeb031852a148

build:
  number: 1

requirements:
  build:
    - ${{ compiler('c') }}
    - ${{ compiler('rust') }}
    - ${{ stdlib("c") }}
    - cargo-bundle-licenses

tests:
  - script:
      - just --help

about:
  license: CC0-1.0
  license_file:
    - LICENSE
    - THIRDPARTY.yml
  summary: just is a handy way to save and run project-specific commands.
  homepage: https://github.com/casey/just

extra:
  recipe-maintainers:
    - dbast
